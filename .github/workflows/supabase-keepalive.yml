name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days without activity.
# This pings the database every 3 days so it stays awake.
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        # keep_alive() is a security-definer RPC that reads mailing_list (anon can't select it directly
        # because of RLS) and returns only the row count. Defined in supabase/schema.sql.
        run: |
          count=$(curl --fail --silent --show-error -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "mailing_list rows: $count"
