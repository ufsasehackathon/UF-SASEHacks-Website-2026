name: Tests

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks, no database
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:unit

  # Local Supabase in Docker (already on GitHub's runners). No secrets: the tests never
  # touch the hosted project, and supabase/schema.sql is applied by the test setup.
  integration:
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
      - name: Database + server action tests
        run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Supabase logs on failure
        if: failure()
        run: docker ps -a && docker logs $(docker ps -aq --filter name=supabase_auth) 2>&1 | tail -50 || true
